openapi: 3.0.3
info:
  title: Dynamic Flow System API
  description: |
    REST API for managing and executing AI-powered dynamic workflows.
    
    This API enables you to:
    - Create and manage flow configurations
    - Manage prompt templates
    - Register and execute tools
    - Execute flows and monitor execution traces
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Flows
    description: Flow configuration management
  - name: Prompts
    description: Prompt template management
  - name: Tools
    description: Tool registry management
  - name: Execution
    description: Flow execution and testing
  - name: Monitoring
    description: Trace and monitoring

paths:
  /admin/flows:
    get:
      tags:
        - Flows
      summary: List all flows
      description: Get a list of all flows with optional filtering
      operationId: listFlows
      parameters:
        - name: status
          in: query
          description: Filter by flow status
          schema:
            type: string
            enum: [active, draft, archived, deprecated]
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: tags
          in: query
          description: Comma-separated tags
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flows:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowConfig'
                  total:
                    type: integer
                    example: 10
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Flows
      summary: Create a new flow
      description: Create a new flow configuration
      operationId: createFlow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConfigInput'
      responses:
        '201':
          description: Flow created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flow:
                    $ref: '#/components/schemas/FlowConfig'
                  message:
                    type: string
                    example: Flow created successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/flows/{flowId}:
    get:
      tags:
        - Flows
      summary: Get flow by ID
      description: Retrieve details of a specific flow
      operationId: getFlowById
      parameters:
        - name: flowId
          in: path
          required: true
          description: Unique flow identifier
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flow:
                    $ref: '#/components/schemas/FlowConfig'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Flows
      summary: Update flow
      description: Update an existing flow configuration
      operationId: updateFlow
      security:
        - bearerAuth: []
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConfigUpdate'
      responses:
        '200':
          description: Flow updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  flow:
                    $ref: '#/components/schemas/FlowConfig'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Flows
      summary: Delete flow
      description: Delete (archive) a flow
      operationId: deleteFlow
      security:
        - bearerAuth: []
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flow deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/flows/{flowId}/versions:
    get:
      tags:
        - Flows
      summary: Get flow versions
      description: Retrieve version history of a flow
      operationId: getFlowVersions
      parameters:
        - name: flowId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowVersion'
                  total:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/prompts:
    get:
      tags:
        - Prompts
      summary: List all prompts
      operationId: listPrompts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, draft, archived]
        - name: category
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PromptConfig'
                  total:
                    type: integer

    post:
      tags:
        - Prompts
      summary: Create a new prompt
      operationId: createPrompt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptConfigInput'
      responses:
        '201':
          description: Prompt created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompt:
                    $ref: '#/components/schemas/PromptConfig'
                  message:
                    type: string

  /admin/prompts/{promptId}:
    get:
      tags:
        - Prompts
      summary: Get prompt by ID
      operationId: getPromptById
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  prompt:
                    $ref: '#/components/schemas/PromptConfig'

    put:
      tags:
        - Prompts
      summary: Update prompt
      operationId: updatePrompt
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptConfigUpdate'
      responses:
        '200':
          description: Prompt updated successfully

    delete:
      tags:
        - Prompts
      summary: Delete prompt
      operationId: deletePrompt
      security:
        - bearerAuth: []
      parameters:
        - name: promptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prompt deleted successfully

  /admin/tools:
    get:
      tags:
        - Tools
      summary: List all tools
      operationId: listTools
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [builtin, custom, external]
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolConfig'
                  total:
                    type: integer

    post:
      tags:
        - Tools
      summary: Register a new tool
      operationId: registerTool
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolConfigInput'
      responses:
        '201':
          description: Tool registered successfully

  /admin/tools/{toolName}:
    get:
      tags:
        - Tools
      summary: Get tool by name
      operationId: getToolByName
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response

  /admin/tools/{toolName}/execute:
    post:
      tags:
        - Tools
      summary: Execute a tool
      operationId: executeTool
      security:
        - bearerAuth: []
      parameters:
        - name: toolName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Tool executed successfully

  /flows/execute:
    post:
      tags:
        - Execution
      summary: Execute a flow
      description: Execute a flow with provided input
      operationId: executeFlow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flowName
                - payload
              properties:
                flowName:
                  type: string
                  example: content-generation-flow
                payload:
                  type: object
                  additionalProperties: true
                  example:
                    query: What is machine learning?
                userId:
                  type: string
                  example: user123
                enableTracing:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Flow executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'

  /flows/test:
    post:
      tags:
        - Execution
      summary: Test a flow
      description: Test a flow configuration without saving it
      operationId: testFlow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flowConfig
                - payload
              properties:
                flowConfig:
                  $ref: '#/components/schemas/FlowConfigInput'
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Flow test completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    $ref: '#/components/schemas/ExecutionResult'
                  message:
                    type: string

  /admin/traces/{traceId}:
    get:
      tags:
        - Monitoring
      summary: Get execution trace
      description: Retrieve detailed execution trace for debugging
      operationId: getExecutionTrace
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  trace:
                    $ref: '#/components/schemas/ExecutionTrace'
                  formatted:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FlowConfig:
      type: object
      properties:
        id:
          type: string
          example: flow_abc123
        name:
          type: string
          example: content-generation-flow
        displayName:
          type: string
          example: Content Generation Flow
        description:
          type: string
        version:
          type: integer
          example: 1
        status:
          type: string
          enum: [active, draft, archived, deprecated]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        inputSchema:
          type: object
        outputSchema:
          type: object
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStep'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FlowConfigInput:
      type: object
      required:
        - name
        - displayName
        - steps
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        inputSchema:
          type: object
        outputSchema:
          type: object
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStep'

    FlowConfigUpdate:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, draft, archived, deprecated]
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStep'
        versionMessage:
          type: string

    FlowStep:
      type: object
      required:
        - id
        - name
        - type
        - handler
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [retrieve, generate, tool, format]
        handler:
          type: string
        inputMapping:
          type: object
          additionalProperties:
            type: string
        outputMapping:
          type: object
          additionalProperties:
            type: string
        config:
          type: object
        timeout:
          type: integer

    FlowVersion:
      type: object
      properties:
        version:
          type: integer
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string

    PromptConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        template:
          type: string
        variables:
          type: array
          items:
            type: string
        version:
          type: integer
        status:
          type: string
          enum: [active, draft, archived]
        category:
          type: string
        tags:
          type: array
          items:
            type: string

    PromptConfigInput:
      type: object
      required:
        - name
        - displayName
        - template
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        template:
          type: string
        variables:
          type: array
          items:
            type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string

    PromptConfigUpdate:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
        template:
          type: string
        status:
          type: string
        versionMessage:
          type: string

    ToolConfig:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [builtin, custom, external]
        category:
          type: string
        status:
          type: string
          enum: [active, inactive]
        inputSchema:
          type: object
        outputSchema:
          type: object

    ToolConfigInput:
      type: object
      required:
        - name
        - displayName
        - type
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        type:
          type: string
        category:
          type: string
        inputSchema:
          type: object
        outputSchema:
          type: object

    ExecutionResult:
      type: object
      properties:
        success:
          type: boolean
        executionId:
          type: string
        traceId:
          type: string
        output:
          type: object
        steps:
          type: array
          items:
            type: object

    ExecutionTrace:
      type: object
      properties:
        id:
          type: string
        flowName:
          type: string
        executionId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
        status:
          type: string
        steps:
          type: array
          items:
            type: object

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
