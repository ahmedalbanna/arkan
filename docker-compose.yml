version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: arkan-ollama
    ports:
      - "11434:11434" # Ollama API port
    volumes:
      - ./ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: serve

  # Init container to pull Ollama models on startup
  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: arkan-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      bash -c "
        ollama pull gemma:2b &&
        ollama pull phi4-mini:latest &&
        ollama pull llama2:7b
      "
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: arkan-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API (optional)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: arkan-postgres
    environment:
      POSTGRES_DB: arkan_dev
      POSTGRES_USER: arkan_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arkan_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkan_user -d arkan_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hasura:
    image: hasura/graphql-engine:v2.36.0
    container_name: arkan-hasura
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgresql://arkan_user:${DB_PASSWORD:-arkan_dev_password}@postgres:5432/arkan_dev
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-hasura_admin_secret_dev}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${NEXTAUTH_SECRET:-your-32-character-secret-key-here-change-in-prod}"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anonymous"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_models:
    driver: local
  qdrant_storage:
    driver: local
  postgres_data:
    driver: local
