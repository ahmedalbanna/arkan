name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # ============================================================================
  # Quality Checks
  # ============================================================================
  
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation check
        run: pnpm run typecheck

      - name: ESLint validation
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Generate coverage report
        run: pnpm run test -- --coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ============================================================================
  # Build
  # ============================================================================

  build:
    name: Build Application
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "Build output not found"
            exit 1
          fi
          echo "Build size: $(du -sh .next/ | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # ============================================================================
  # Security Checks
  # ============================================================================

  security-checks:
    name: Security Checks
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          if grep -r "private_key\|api_key\|secret_key" src/ --include="*.ts" --include="*.tsx" | grep -v "node_modules"; then
            echo "Hardcoded secrets found!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Verify environment template
        run: |
          if [ ! -f ".env.example" ]; then
            echo ".env.example not found"
            exit 1
          fi
          echo "Environment template verified"

  # ============================================================================
  # Pre-Deployment Verification
  # ============================================================================

  verify-deployment:
    name: Verify Deployment Readiness
    needs: [build, security-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pre-deployment verification
        run: bash scripts/pre-deployment-verify.sh

      - name: Verify Firebase configuration
        run: |
          if [ ! -f "firebase.json" ]; then
            echo "firebase.json not found"
            exit 1
          fi
          echo "Firebase configuration verified"

  # ============================================================================
  # Deploy to Staging
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    needs: verify-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-arkan.firebaseapp.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-output
          path: .next/

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Staging
        run: |
          firebase deploy \
            --project=${{ secrets.FIREBASE_PROJECT_ID_STAGING }} \
            --token=${{ secrets.FIREBASE_TOKEN }} \
            --only hosting,firestore,storage
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}

      - name: Verify staging deployment
        run: |
          curl -f https://staging-arkan.firebaseapp.com/api/health || exit 1
        timeout-minutes: 5
        continue-on-error: true

      - name: Post deployment notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

  # ============================================================================
  # Deploy to Production
  # ============================================================================

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://arkan.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: build-output
          path: .next/

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Create deployment tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a v${{ github.run_number }} -m "Production deployment run ${{ github.run_number }}"
          git push origin v${{ github.run_number }}
        continue-on-error: true

      - name: Deploy to Firebase Production
        run: |
          firebase deploy \
            --project=${{ secrets.FIREBASE_PROJECT_ID }} \
            --token=${{ secrets.FIREBASE_TOKEN }} \
            --only hosting,firestore,storage,functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify production deployment
        run: |
          for i in {1..5}; do
            if curl -f https://arkan.example.com/api/health; then
              echo "Production deployment verified!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1
        timeout-minutes: 5

      - name: Post deployment notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: '🚀 Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action
        continue-on-error: true

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Production Release v${{ github.run_number }}
          body: |
            # Production Deployment
            
            **Status:** ✅ Successful
            
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            
            ## Changes
            ${{ github.event.head_commit.message }}
            
            ## Deployment Info
            - **Environment:** Production
            - **Date:** ${{ github.event.head_commit.timestamp }}
            - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          draft: false
          prerelease: false

  # ============================================================================
  # Post-Deployment Monitoring
  # ============================================================================

  monitor-deployment:
    name: Monitor Deployment
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    
    steps:
      - name: Check application health
        run: |
          for i in {1..3}; do
            echo "Health check attempt $i..."
            curl -s https://arkan.example.com/api/health | jq .
            sleep 5
          done

      - name: Monitor error rate
        run: |
          echo "Monitoring error rate..."
          # This would typically call your monitoring service API
          echo "Error rate check complete"
        continue-on-error: true

      - name: Check database connectivity
        run: |
          echo "Verifying database connectivity..."
          # This would typically verify Firestore is accessible
          echo "Database connectivity verified"
        continue-on-error: true

      - name: Post monitoring notification
        uses: 8398a7/action-slack@v3
        with:
          status: 'success'
          text: '✅ Post-deployment monitoring complete'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
